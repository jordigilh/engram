name: Publish Kubernaut RCA Image

on:
  push:
    branches: [main]
    paths:
      - Dockerfile.rca
      - src/engram/incident/**
      - src/engram/pipeline/kubernaut_corpus_inventory.py
      - src/engram/pipeline/kubernaut_rca_backfill.py
      - src/engram/pipeline/kubernaut_rca_service.py
      - pyproject.toml
      - .github/workflows/publish-rca-image.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      IMAGE: quay.io/jordigilh/engram
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Quay
        env:
          QUAY_USERNAME: ${{ secrets.QUAY_ROBOT_USERNAME }}
          QUAY_TOKEN: ${{ secrets.QUAY_ROBOT_TOKEN }}
        run: echo "$QUAY_TOKEN" | docker login quay.io -u "$QUAY_USERNAME" --password-stdin

      - name: Build immutable image
        run: docker build --pull -f Dockerfile.rca -t "$IMAGE:${GITHUB_SHA}" .

      - name: Push immutable image
        run: docker push "$IMAGE:${GITHUB_SHA}"

      - name: Tag and push latest
        run: |
          docker tag "$IMAGE:${GITHUB_SHA}" "$IMAGE:latest"
          docker push "$IMAGE:latest"
