[defaults]
hindsight_url = "http://localhost:8888"
pg_dsn = "postgresql://hindsight:hindsight@localhost:5432/hindsight"
embedding_model = "sentence-transformers/all-MiniLM-L6-v2"
pg_pool_min_size = 2
pg_pool_max_size = 5

[projects.kubernaut]
banks = ["shared-memory", "kubernaut-docs", "kubernaut-issues"]
recall_banks = ["hindsight", "hindsight-docs", "hindsight-issues", "cocoindex-code"]
code_bank = "cocoindex-code"
coverage_prefix = ""
code_table = "code_embeddings"
log_suffix = ""
nightly_run_time = "02:01"
issues_repos = [
  "jordigilh/kubernaut",
  "jordigilh/kubernaut-operator",
  "jordigilh/kubernaut-console",
  "jordigilh/kubernaut-demo-scenarios",
  "jordigilh/kubernaut-docs",
]
release_lines = ["v1.5"]
rca_project = "kubernaut"
rca_repository = "jordigilh/kubernaut"
rca_projects = ["kubernaut", "kubernaut-operator"]
workspace_prefixes = ["Users-jgil-go-src-github-com-jordigilh-kubernaut"]

[projects.kubernaut.paths]
docs_dir = "~/.engram/watch/kubernaut-docs/docs"
code_dir = "~/.engram/watch/kubernaut"
code_docs_dir = "~/.engram/watch/kubernaut/docs"
operator_dir = "~/.engram/watch/kubernaut-operator"
console_dir = "~/.engram/watch/kubernaut-console"
scenarios_dir = "~/.engram/watch/kubernaut-demo-scenarios"
transcripts_dir = "~/.cursor/projects"
release_watch_root = "~/.engram/watch"
cocoindex_db = "~/.engram/cocoindex.db"
transcript_watermarks = "~/.engram/logs/cocoindex-transcript-watermarks.json"

[projects.kubernaut.mental_models]
kubernaut-issues = ["active-priorities", "known-bugs"]
shared-memory = ["workflow-preferences", "architecture-decisions", "testing-methodology", "coding-conventions"]
kubernaut-docs = ["af-pipeline", "platform-topology", "ka-architecture", "operator-architecture", "console-architecture"]

[[projects.kubernaut.probes]]
bank = "shared-memory"
query = "Go testing conventions and patterns"
[[projects.kubernaut.probes]]
bank = "kubernaut-docs"
query = "signal processing architecture and data flow"
[[projects.kubernaut.probes]]
bank = "kubernaut-docs"
query = "remediation orchestrator CRD spec"
[[projects.kubernaut.probes]]
bank = "kubernaut-issues"
query = "rate limiter design decisions and requirements"
[[projects.kubernaut.probes]]
bank = "kubernaut-issues"
query = "A2A streaming event structure"
[[projects.kubernaut.probes]]
bank = "kubernaut-docs"
query = "kubernaut-operator reconciliation loop and CRD controllers"
[[projects.kubernaut.probes]]
bank = "kubernaut-docs"
query = "kubernaut-console UI components and platform API usage"

