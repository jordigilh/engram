[workspace]
resolver = "2"
members = ["crates/engram-ingest", "crates/engram-mcp", "crates/engram-proxy"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
rust-version = "1.88"

[workspace.dependencies]
async-trait = "0.1"
axum = "0.8"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4", features = ["derive"] }
futures = "0.3"
flate2 = "1"
getrandom = "0.2"
globset = "0.4"
libc = "0.2"
pdf-extract = "0.12"
postgres = { version = "0.19", features = ["with-chrono-0_4", "with-serde_json-1"] }
regex = "1"

rmcp = { version = "3.11", default-features = false, features = ["client", "transport-child-process"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
sha2 = "0.10"
signal-hook = "0.3"
thiserror = "2"
tiktoken-rs = "0.12"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "process"] }
tokio-util = { version = "0.7", features = ["rt"] }
toml = { version = "0.8", features = ["preserve_order"] }
url = "2"

[profile.release]
lto = "thin"
strip = "symbols"
