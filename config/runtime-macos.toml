# Image-backed macOS front door.
#
# The native gateway owns the host-only stdio backends and listens privately on
# 8898. The published image uses this registry to relay each route through it,
# preserving the complete multi-repository catalog while moving the public
# MCP listener into a reproducible container.

[instances."dcm-acm-cluster-service-provider"]
endpoint = "http://host.containers.internal:8898/mcp/dcm-acm-cluster-service-provider"
[instances."dcm"]
endpoint = "http://host.containers.internal:8898/mcp/dcm"
