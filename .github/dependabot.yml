version: 2

updates:
  # Python dependencies (pyproject.toml) — the pipeline package itself.
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "python"
    groups:
      python-patch-and-minor:
        update-types:
          - "minor"
          - "patch"

  # npm dependencies for the OpenCode plugin (separate package.json).
  - package-ecosystem: "npm"
    directory: "/opencode-plugin"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "javascript"
    groups:
      npm-patch-and-minor:
        update-types:
          - "minor"
          - "patch"

  # Base image used by the Linux/containerized Hindsight Dockerfile.
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "docker"

  # Actions used by CI (actions/checkout, actions/setup-python, etc.).
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"
    groups:
      github-actions:
        patterns:
          - "*"
