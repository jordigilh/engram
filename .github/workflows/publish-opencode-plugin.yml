name: Publish OpenCode plugin

on:
  push:
    tags:
      - "opencode-plugin-v*"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: opencode-plugin
    steps:
      - uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Set up npm for trusted publishing
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install plugin dependencies
        run: bun install --frozen-lockfile

      - name: Verify release tag matches package version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          package_version="$(node -p 'require("./package.json").version')"
          tag_version="${RELEASE_TAG#opencode-plugin-v}"
          test "${package_version}" = "${tag_version}"

      - name: Build and test plugin
        run: |
          bun run build
          bun test ./

      - name: Stage immutable versioned package
        run: npm stage publish
