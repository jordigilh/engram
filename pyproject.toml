[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "engram"
version = "0.1.0"
description = "Hindsight/CocoIndex ingestion and memory-management pipeline for engram and its client projects"
requires-python = ">=3.12"
dependencies = [
    "cocoindex==1.0.18",
    "anthropic==0.120.0",
    "litellm==1.93.0",
    "mcp==1.28.1",
    "openai==2.48.0",
    "psycopg2-binary==2.9.12",
    "pdfplumber==0.11.10",
    "sentence-transformers==5.6.1",
    "requests==2.34.2",
    "watchdog==6.0.0",
    "numpy==2.5.1",
    "torch==2.13.0",
    "asyncpg==0.31.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]
