# Lint config for the Engram pipeline scripts. Run with:
#   ruff check .
#
# Enforced in CI as of 2026-08-12 (see .github/workflows/ci.yml) -- this file
# is the checked-in baseline that job lints against.
target-version = "py313"
line-length = 120

[lint]
# Defaults (E4, E7, E9, F) plus E402 (import order) -- deliberately strict
# about import placement except where a script must set an env var (e.g.
# COCOINDEX_DB) before importing cocoindex; those spots use an explicit
# `# noqa: E402` rather than a blanket exception.
select = ["E4", "E7", "E9", "F", "E402"]
