name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install engram + dev deps
        run: pip install -e ".[dev]"

      - name: ruff check
        run: ruff check .

      - name: pytest
        run: pytest tests/ -q
