name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only token: every job here only checks out the repository, installs
# dependencies, and runs tests. Nothing pushes commits, images, or releases.
permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install engram + dev deps
        run: pip install -e ".[dev]"

      - name: ruff check
        run: ruff check .

      - name: pytest (unit tier)
        run: |
          coverage erase
          coverage run --branch --source=src \
            -m pytest tests/ -m "not integration" -q
          # The managed zvec policy is a dedicated, unit-testable business
          # boundary. Keep its release gate strict while the legacy gateway
          # catalog/transport remains a much larger separately-reported surface.
          coverage report --include='*/src/engram/pipeline/zvec_policy.py' --fail-under=90

  opencode-plugin-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install plugin deps
        run: bun install
        working-directory: opencode-plugin

      - name: bun test (opencode plugin)
        run: bun run coverage:check
        working-directory: opencode-plugin

      - name: Build distributable plugin
        run: bun run build
        working-directory: opencode-plugin

  rust-mcp:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: engram_ingest_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      ENGRAM_INGEST_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/engram_ingest_test
    steps:
      - uses: actions/checkout@v7

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: cargo fmt
        run: cargo fmt --all --check

      - name: cargo clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: cargo test
        run: cargo test --all --locked

  rust-mcp-msrv:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v7

      - name: Set up Rust at the declared MSRV
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.88.0"

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: cargo check at MSRV
        run: cargo check --all-targets --locked

  rust-coverage:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: engram_ingest_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      ENGRAM_INGEST_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/engram_ingest_test
    steps:
      - uses: actions/checkout@v7

      - name: Set up Rust with llvm tools
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Unit-tier coverage gate
        run: cargo llvm-cov -p engram-ingest --all-targets --fail-under-lines 90

      - name: Business-logic unit coverage gate
        run: cargo llvm-cov -p engram-ingest --lib --ignore-filename-regex '(http|store|sink|worker)\.rs' --fail-under-lines 90

  integration-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      IT_POSTGRES_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install engram + dev deps
        run: pip install -e ".[dev]"

      - name: pytest (integration tier)
        # The integration tier currently has no tests: the callgraph cache
        # test was removed with the issue #199 consolidation and the pgvector
        # test with ac619a3. Keep the tier for future integration tests, but
        # skip cleanly when the directory is absent or has no test files: both
        # cases take the visible else branch below (echo + exit 0), so a
        # deleted or typo'd path shows up as a clean skip, not a failure.
        run: |
          if [ -d tests/integration ] && [ -n "$(find tests/integration -name 'test_*.py' -type f)" ]; then
            pytest tests/integration/ -m integration -q
          else
            echo "No integration tests present; tier retained for future use."
          fi
