name: Release OpenCode plugin artifact

on:
  push:
    tags:
      - "opencode-plugin-v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: opencode-plugin
    steps:
      - uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install plugin build dependencies
        run: bun install --frozen-lockfile

      - name: Verify release tag matches package version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          package_version="$(node -p 'require("./package.json").version')"
          tag_version="${RELEASE_TAG#opencode-plugin-v}"
          test "${package_version}" = "${tag_version}"

      - name: Build and test plugin
        run: |
          bun run build
          bun test ./

      - name: Build pinned release artifact
        run: bun run artifact

      - name: Create GitHub release with checksummed artifact
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version="${RELEASE_TAG#opencode-plugin-v}"
          gh release create "${RELEASE_TAG}" \
            "release/engram-opencode-plugin-${version}.tar.gz" \
            "release/engram-opencode-plugin-${version}.tar.gz.sha256" \
            --verify-tag \
            --title "Engram OpenCode plugin ${version}" \
            --generate-notes
