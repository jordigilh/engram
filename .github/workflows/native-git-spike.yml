name: Native Git spike matrix

on:
  pull_request:
    paths:
      - "opencode-plugin/git-native-spike/**"
      - "opencode-plugin/index.ts"
      - "opencode-plugin/worktree-index.ts"
      - ".github/workflows/native-git-spike.yml"
  push:
    branches: [main]
    paths:
      - "opencode-plugin/git-native-spike/**"
      - "opencode-plugin/index.ts"
      - "opencode-plugin/worktree-index.ts"
      - ".github/workflows/native-git-spike.yml"

# Read-only token: these lanes only build and test the native spike crate.
permissions:
  contents: read

jobs:
  host-artifacts:
    name: Host artifact (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # These are the native Bun/Node-API publishing lanes. Supported
        # surfaces are macOS hosts (local development, not CI-hosted) and
        # Linux containers; macOS and Windows hosted-runner lanes were
        # dropped accordingly. ARM64 Linux is cross-checked below because
        # public hosted ARM runners are not available consistently.
        os: [ubuntu-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Rust format, test, and check
        working-directory: opencode-plugin/git-native-spike
        run: |
          cargo fmt -- --check
          cargo test
          cargo check
      - name: Build the host N-API artifact
        working-directory: opencode-plugin/git-native-spike
        run: bun run build
      - name: Bun native smoke probe
        working-directory: opencode-plugin/git-native-spike
        run: bun run probe

  cross-target-checks:
    name: Cross-target check (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - aarch64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Check the cross-platform Rust surface
        working-directory: opencode-plugin/git-native-spike
        run: cargo check --target ${{ matrix.target }}
