[build-system]
requires = ["setuptools>=84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "engram"
version = "0.1.0"
description = "Hindsight/CocoIndex ingestion and memory-management pipeline for engram and its client projects"
requires-python = ">=3.13"
dependencies = [
    "cocoindex==1.0.20",
    "anthropic==1.0.0",
    "litellm==1.97.0",
    "mcp==2.0.0",
    "httpx==0.28.1",
    "starlette==1.6.0",
    "uvicorn==0.52.4",
    "openai==2.54.0",
    "psycopg2-binary==2.9.12",
    "pdfplumber==0.11.10",
    "sentence-transformers==6.0.0",
    "requests==2.34.2",
    "watchdog==6.0.0",
    "numpy==2.5.2",
    "torch==2.13.0",
    "asyncpg==0.31.0",
    # Call-graph extraction spike (docs/CALL_GRAPH_CLUSTERING.md, issue #43):
    # networkx holds the directed call graph and answers blast-radius/
    # shortest-path queries; igraph+leidenalg (not the heavier graspologic
    # stack) do Leiden community detection. ~5-6MB combined footprint.
    "networkx==3.6.1",
    "python-igraph==1.0.0",
    "leidenalg==0.12.0",
]

[project.optional-dependencies]
dev = ["pytest>=9.1.1", "ruff==0.16.4"]

[tool.pytest.ini_options]
markers = [
    "integration: tests requiring a real Postgres+pgvector instance (see tests/integration/README.md); excluded from the default `pytest` run",
]

# The 16 launchd-invoked entry points only (6 flows + 6 search + nightly-learn
# + ingest-issues + hindsight-proxy + serena-multiplex). ingest-docs and the
# maintenance/backfill tools are run by hand, not by launchd -- invoke those
# as `python -m engram.pipeline.ingest_docs` / `python -m engram.maintenance.report`.
[project.scripts]
engram-flows-kubernaut = "engram.flows.kubernaut:main"
engram-flows-dcm = "engram.flows.dcm:main"
engram-flows-engram = "engram.flows.engram:main"
engram-flows-koku = "engram.flows.koku:main"
engram-flows-praxis = "engram.flows.praxis:main"
engram-flows-rhdh-plugins = "engram.flows.rhdh_plugins:main"
engram-search-kubernaut = "engram.search.kubernaut:main"
engram-search-dcm = "engram.search.dcm:main"
engram-search-engram = "engram.search.engram:main"
engram-search-koku = "engram.search.koku:main"
engram-search-praxis = "engram.search.praxis:main"
engram-search-rhdh-plugins = "engram.search.rhdh_plugins:main"
engram-nightly-learn = "engram.pipeline.nightly_learn:main"
engram-ingest-issues = "engram.pipeline.ingest_issues:main"
engram-hindsight-proxy = "engram.pipeline.hindsight_proxy:cli_main"
engram-serena-multiplex = "engram.pipeline.serena_multiplex:main"
engram-gateway = "engram.pipeline.engram_gateway:main"

[tool.setuptools.packages.find]
where = ["src"]
